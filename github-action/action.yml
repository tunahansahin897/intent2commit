name: "Intent2Commit Fulfillment Check"
description: "Check intent fulfillment and detect drift in pull requests"
author: "Andora Bilisim"
branding:
  icon: "target"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token for PR comments"
    required: true
  min-fulfillment-score:
    description: "Minimum fulfillment score required (default: 70)"
    required: false
    default: "70"
  fail-on-low-fulfillment:
    description: "Fail the check if fulfillment is below threshold"
    required: false
    default: "false"
  fail-on-drift:
    description: "Fail the check if intent drift is detected"
    required: false
    default: "false"
  comment-on-pr:
    description: "Post fulfillment report as PR comment"
    required: false
    default: "true"

outputs:
  fulfillment-score:
    description: "The calculated intent fulfillment score (0-100)"
  fulfillment-level:
    description: "Fulfillment level (excellent/good/fair/poor)"
  drift-detected:
    description: "Whether intent drift was detected (true/false)"
  badge-url:
    description: "URL to fulfillment badge for README"

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    MIN_FULFILLMENT_SCORE: ${{ inputs.min-fulfillment-score }}
    FAIL_ON_LOW_FULFILLMENT: ${{ inputs.fail-on-low-fulfillment }}
    FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
    COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
